<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanafi Ilham | Portfolio</title>
    <link rel="stylesheet" href="src/output.css" />
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body class="bg-white text-dark dark:bg-dark">
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="floating-actions"></div>

    <script src="src/icons.js"></script>
    <script src="src/data.js"></script>
    <script src="src/templates/layout.js"></script>
    <script src="src/templates/project-modal.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/render.js"></script>
    <script src="src/modal.js"></script>
    <script src="src/interactions.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
